[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stringartio-preference-lab"
version = "0.1.0"
description = "Human Preference-based quality optimization system for StringArtio outputs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "StringArtio" }]
dependencies = []

[project.optional-dependencies]
dev = ["coverage[toml]>=7.6"]
portfolio = ["Pillow>=10"]

[project.scripts]
stringart-lab = "stringartio_preference_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-dir = "tests"

[tool.coverage.run]
branch = true
source = ["stringartio_preference_lab"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true
